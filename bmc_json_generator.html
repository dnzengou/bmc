<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BMC JSON → HTML Generator</title>
<style>
body { font-family:Arial; padding:20px; }
textarea { width:100%; height:180px; }
pre { background:#f4f4f4; padding:15px; }
</style>
</head>
<body>
<h2>Multi‑Project BMC Generator</h2>
<p>Paste project JSON below:</p>
<textarea id="input">{
  "project": "Example EO Project",
  "Key Partners": "ESA, Industry",
  "Value Proposition": "Cloud‑free analytics"
}</textarea>
<button onclick="render()">Generate HTML</button>
<pre id="out"></pre>
<script>
function render(){
 const data = JSON.parse(document.getElementById('input').value);
 let html = `<h2>${data.project}</h2><ul>`;
 for (let k in data){ if(k!=='project'){ html += `<li><b>${k}:</b> ${data[k]}</li>`; }}
 html+='</ul>';
 document.getElementById('out').textContent = html;
}
</script>
</body>
</html>
